<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>Leitura Bíblica · Leandro</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #085041;
    --blue: #378ADD;
    --red: #E24B4A;
    --bg: #F7F6F2;
    --bg2: #EFEDE8;
    --border: #DDD9D0;
    --text: #1A1A18;
    --text2: #7A7568;
    --white: #FFFFFF;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  .top-nav {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    padding-top: env(safe-area-inset-top);
  }
  .nav-tabs { display: flex; }
  .nav-tab {
    flex: 1; padding: 11px 4px 10px;
    text-align: center; cursor: pointer;
    font-size: 11px; font-weight: 500;
    color: var(--text2);
    border: none; background: none;
    display: flex; flex-direction: column;
    align-items: center; gap: 3px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: 0.01em;
  }
  .nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
  .nav-tab svg { width: 19px; height: 19px; }
  .badge {
    background: var(--red); color: #fff;
    font-size: 9px; font-weight: 600;
    border-radius: 8px; padding: 1px 5px;
    margin-left: 2px; line-height: 1.4;
  }

  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* HOME */
  .home-header {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.1rem 0.85rem;
  }
  .home-title {
    font-family: 'Lora', serif;
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  .home-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  .prog-section {
    padding: 0.85rem 1.1rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
  }
  .prog-track {
    height: 9px; background: var(--bg2);
    border-radius: 5px; overflow: hidden;
  }
  .prog-fill {
    height: 100%; background: var(--blue);
    border-radius: 5px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .prog-info {
    font-size: 11px; color: var(--text2);
    margin-top: 5px;
    display: flex; justify-content: space-between;
  }

  /* Texto Diário */
  .daily-card {
    margin: 0.85rem 1.1rem;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .daily-card-head {
    background: #EEF4FB;
    padding: 0.6rem 1rem;
    display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #D5E5F5;
  }
  .daily-dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: var(--blue); flex-shrink: 0;
  }
  .daily-head-label {
    font-size: 12px; font-weight: 600;
    color: #1a4a7a; letter-spacing: 0.02em;
    flex: 1;
  }
  .daily-link {
    font-size: 11px; color: var(--blue);
    text-decoration: none; font-weight: 500;
  }
  .daily-body { padding: 0.9rem 1rem 1rem; }
  .daily-date-lbl { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .daily-verse {
    font-family: 'Lora', serif;
    font-size: 13px; font-style: italic;
    color: var(--text); margin-bottom: 0.65rem;
    line-height: 1.5; font-weight: 500;
  }
  .daily-text {
    font-size: 13px; color: var(--text2);
    line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .daily-text.expanded {
    display: block;
    -webkit-line-clamp: unset;
  }
  .daily-toggle {
    margin-top: 0.5rem;
    font-size: 12px; font-weight: 600;
    color: var(--blue); cursor: pointer;
    background: none; border: none;
    padding: 0; font-family: 'Inter', sans-serif;
  }
  .daily-loading {
    font-size: 13px; color: var(--text2);
    font-style: italic; text-align: center;
    padding: 0.5rem 0;
  }
  .daily-error {
    font-size: 12px; color: var(--text2);
    text-align: center; padding: 0.5rem 0;
  }
  .daily-error a { color: var(--blue); }

  /* Today card */
  .today-card {
    margin: 0 1.1rem 1.1rem;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .today-card-head {
    background: var(--green-light);
    padding: 0.65rem 1rem;
    display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid #C5E9DA;
  }
  .today-dot {
    width: 7px; height: 7px;
    border-radius: 50%; background: var(--green); flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .today-head-label {
    font-size: 12px; font-weight: 600;
    color: var(--green-dark); letter-spacing: 0.02em;
  }
  .today-card-body { padding: 1rem 1rem 1.1rem; }
  .today-date-txt { font-size: 12px; color: var(--text2); margin-bottom: 5px; }
  .today-pass-txt {
    font-family: 'Lora', serif;
    font-size: 24px; font-weight: 600;
    color: var(--text); line-height: 1.25; margin-bottom: 1.1rem;
  }
  .today-btn {
    width: 100%; padding: 11px;
    border-radius: var(--radius-sm); border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif; transition: all 0.15s;
    letter-spacing: 0.01em;
  }
  .today-btn.unread { background: var(--green); color: #fff; }
  .today-btn.unread:active { background: #178060; transform: scale(0.98); }
  .today-btn.read { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }
  .today-btn.read:active { transform: scale(0.98); }

  .no-today {
    margin: 0 1.1rem 1.1rem; padding: 1.5rem 1rem;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); text-align: center;
    color: var(--text2); font-size: 14px;
  }

  /* LIST */
  .month-nav {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0.6rem 1rem;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  .mnav-btn {
    background: none; border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 15px; font-size: 15px;
    color: var(--text); cursor: pointer;
    transition: background 0.1s;
  }
  .mnav-btn:active { background: var(--bg2); }
  .month-title {
    font-family: 'Lora', serif;
    font-size: 15px; font-weight: 600; color: var(--text);
  }

  .day-item {
    display: flex; align-items: center;
    gap: 12px; padding: 0.7rem 1.1rem;
    border-bottom: 1px solid var(--border);
    cursor: pointer; background: var(--white);
    transition: background 0.1s;
  }
  .day-item:active { background: var(--bg2); }
  .day-item.is-today { background: var(--green-light); }

  .check {
    width: 27px; height: 27px; border-radius: 50%;
    border: 1.5px solid var(--border);
    flex-shrink: 0; display: flex;
    align-items: center; justify-content: center;
    transition: all 0.2s; background: var(--white);
  }
  .check.done { background: var(--green); border-color: var(--green); }
  .check.done::after {
    content: ''; display: block;
    width: 10px; height: 6px;
    border-left: 2px solid white; border-bottom: 2px solid white;
    transform: rotate(-45deg) translateY(-1px);
  }
  .day-info { flex: 1; min-width: 0; }
  .day-date-lbl { font-size: 11px; color: var(--text2); }
  .day-pass {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .today-pill {
    font-size: 10px; font-weight: 600;
    background: var(--green); color: #fff;
    padding: 2px 8px; border-radius: 10px; flex-shrink: 0;
  }
  .miss-pill { font-size: 10px; font-weight: 500; color: var(--red); flex-shrink: 0; }

  /* PENDING */
  .pend-header {
    background: var(--white); border-bottom: 1px solid var(--border);
    padding: 1rem 1.1rem 0.85rem;
  }
  .pend-title {
    font-family: 'Lora', serif;
    font-size: 18px; font-weight: 600; color: var(--text);
  }
  .pend-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .section-lbl {
    padding: 0.55rem 1.1rem;
    font-size: 11px; font-weight: 600; color: var(--text2);
    letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--bg2); border-bottom: 1px solid var(--border);
  }
  .empty-state {
    padding: 3.5rem 2rem; text-align: center;
    color: var(--text2); font-size: 14px; line-height: 1.7;
  }
  .empty-icon { font-size: 36px; margin-bottom: 0.75rem; }
</style>
</head>

const MONTHS = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DAYS = ['dom.','seg.','ter.','qua.','qui.','sex.','sáb.'];
const KEY = 'leandro_bible_2026';

let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}

const todayStr = new Date().toISOString().slice(0,10);
const todayEntry = plan.find(x => x.d === todayStr);
let curMonth = new Date().getMonth();
let curYear = new Date().getFullYear();

function save() { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} }

function toggle(dateStr) {
  if (done[dateStr]) delete done[dateStr]; else done[dateStr] = true;
  save(); render();
}
function toggleToday() { if (todayEntry) toggle(todayEntry.d); }

function streak() {
  let s = 0, d = new Date(todayStr);
  while (true) {
    const ds = d.toISOString().slice(0,10);
    if (done[ds]) { s++; d.setDate(d.getDate()-1); } else break;
  }
  return s;
}

function fmtDate(ds) {
  const d = new Date(ds + 'T00:00:00');
  return d.getDate() + ' de ' + MONTHS[d.getMonth()];
}

// ── TEXTO DIÁRIO ──────────────────────────────────────────────────
async function loadDailyText() {
  const body = document.getElementById('daily-body');
  const d = new Date();
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();

  try {
    const res = await fetch(`/api/daily?year=${y}&month=${m}&day=${day}`);
    if (!res.ok) throw new Error('api error');
    const data = await res.json();

    // JW API: items array, each item has .content (HTML string)
    const item = data.items && data.items[0];
    if (!item || !item.content) throw new Error('no content');

    const parser = new DOMParser();
    const doc = parser.parseFromString(item.content, 'text/html');

    // Date heading
    const heading = doc.querySelector('h2, h3');
    const dateText = heading ? heading.textContent.trim() : '';

    // Verse: first <p> with <em> (themeScrp)
    let verseHtml = '';
    const themeScrp = doc.querySelector('.themeScrp, blockquote p, p em');
    if (themeScrp) {
      const p = themeScrp.closest('p') || themeScrp.parentElement;
      verseHtml = p ? p.innerHTML : themeScrp.innerHTML;
    }

    // Commentary: all <p> inside .bodyTxt or all remaining <p> after verse
    let commentaryHtml = '';
    const bodyTxt = doc.querySelector('.bodyTxt, .text-commentary');
    if (bodyTxt) {
      commentaryHtml = bodyTxt.innerHTML;
    } else {
      // fallback: grab all p tags except the first (verse)
      const allP = doc.querySelectorAll('p');
      const parts = [];
      allP.forEach((p, i) => {
        if (i > 0 && p.textContent.trim().length > 20) parts.push(p.innerHTML);
      });
      commentaryHtml = parts.join('<br><br>');
    }

    // Clean up links (remove hrefs that won't work)
    commentaryHtml = commentaryHtml.replace(/href="[^"]*"/g, 'href="#"');
    verseHtml = verseHtml.replace(/href="[^"]*"/g, 'href="#"');

    body.innerHTML = `
      ${dateText ? `<div class="daily-date-lbl">${dateText}</div>` : ''}
      ${verseHtml ? `<div class="daily-verse">${verseHtml}</div>` : ''}
      ${commentaryHtml ? `
    <div class="daily-text-full" id="daily-txt">${commentaryHtml}</div>
` : ''}
    `;
  } catch(e) {
    body.innerHTML = `
      <div class="daily-error">
        Não foi possível carregar o texto do dia.<br>
        <a href="https://wol.jw.org/pt/wol/h/r5/lp-t" target="_blank">Abrir no site ↗</a>
      </div>`;
  }
}

function toggleDailyText() {
  const txt = document.getElementById('daily-txt');
  const btn = document.getElementById('daily-toggle-btn');
  if (!txt) return;
  if (txt.classList.contains('expanded')) {
    txt.classList.remove('expanded');
    btn.textContent = 'Ler mais ▾';
  } else {
    txt.classList.add('expanded');
    btn.textContent = 'Ler menos ▴';
  }
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  const total = plan.length;
  const cnt = Object.keys(done).length;
  const pct = Math.round(cnt / total * 100);

  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-done-lbl').textContent = cnt + ' lidas';
  document.getElementById('prog-pct').textContent = pct + '%';

  const area = document.getElementById('today-area');
  if (todayEntry) {
    const d = new Date(todayEntry.d + 'T00:00:00');
    const isDone = !!done[todayEntry.d];
    area.innerHTML = `
      <div class="today-card">
        <div class="today-card-head">
          <div class="today-dot"></div>
          <span class="today-head-label">Leitura de hoje</span>
        </div>
        <div class="today-card-body">
          <div class="today-date-txt">${DAYS[d.getDay()]} · ${fmtDate(todayEntry.d)}</div>
          <div class="today-pass-txt">${todayEntry.p}</div>
          <button class="today-btn ${isDone?'read':'unread'}" onclick="toggleToday()">
            ${isDone ? 'Lida hoje ✓' : 'Marcar como lida'}
          </button>
        </div>
      </div>`;
  } else {
    area.innerHTML = '<div class="no-today">Nenhuma leitura programada para hoje.</div>';
  }

  renderList();
  renderPending();
}

function renderList() {
  document.getElementById('month-lbl').textContent = MONTHS[curMonth] + ' ' + curYear;
  const items = plan.filter(x => {
    const d = new Date(x.d + 'T00:00:00');
    return d.getMonth() === curMonth && d.getFullYear() === curYear;
  });
  const el = document.getElementById('day-list');
  el.innerHTML = '';
  items.forEach(item => {
    const d = new Date(item.d + 'T00:00:00');
    const isToday = item.d === todayStr;
    const isDone = !!done[item.d];
    const isPast = item.d < todayStr && !isDone;
    const row = document.createElement('div');
    row.className = 'day-item' + (isToday ? ' is-today' : '');
    row.innerHTML = `
      <div class="check ${isDone?'done':''}"></div>
      <div class="day-info">
        <div class="day-date-lbl">${d.getDate()} · ${DAYS[d.getDay()]}</div>
        <div class="day-pass">${item.p}</div>
      </div>
      ${isToday ? '<span class="today-pill">Hoje</span>' : (isPast ? '<span class="miss-pill">pendente</span>' : '')}
    `;
    row.addEventListener('click', () => toggle(item.d));
    el.appendChild(row);
  });
}

function renderPending() {
  const pending = plan.filter(x => x.d < todayStr && !done[x.d]);
  const badge = document.getElementById('pend-badge');
  badge.style.display = pending.length ? 'inline' : 'none';
  badge.textContent = pending.length;
  document.getElementById('pend-sub').textContent =
    pending.length ? pending.length + ' leituras · toque para marcar como lida' : 'Tudo em dia!';

  const el = document.getElementById('pend-list');
  el.innerHTML = '';
  if (!pending.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">✓</div>Nenhuma leitura pendente.<br>Você está em dia!</div>';
    return;
  }
  let lastM = '';
  pending.forEach(item => {
    const d = new Date(item.d + 'T00:00:00');
    const mk = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    if (mk !== lastM) {
      lastM = mk;
      const sec = document.createElement('div');
      sec.className = 'section-lbl';
      sec.textContent = mk;
      el.appendChild(sec);
    }
    const row = document.createElement('div');
    row.className = 'day-item';
    row.innerHTML = `
      <div class="check"></div>
      <div class="day-info">
        <div class="day-date-lbl">${fmtDate(item.d)} · ${DAYS[d.getDay()]}</div>
        <div class="day-pass">${item.p}</div>
      </div>
    `;
    row.addEventListener('click', () => toggle(item.d));
    el.appendChild(row);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

document.getElementById('btn-prev').addEventListener('click', () => {
  curMonth--; if (curMonth < 0) { curMonth = 11; curYear--; } renderList();
});
document.getElementById('btn-next').addEventListener('click', () => {
  curMonth++; if (curMonth > 11) { curMonth = 0; curYear++; } renderList();
});

render();
loadDailyText();
